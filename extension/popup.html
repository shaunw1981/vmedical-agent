<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>Valley Medical Reminders</title>
</head>
<body>
  <header class="head">
    <div class="brand">
      <span class="dot"></span>
      <span>Valley Medical · Reminders</span>
    </div>
    <button id="gearBtn" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
  </header>

  <!-- Shown when the dashboard URL / API key aren't set yet -->
  <section id="setupNeeded" class="pad" hidden>
    <h2>Connect to the dashboard</h2>
    <p class="muted">Before you can schedule reminders, add the dashboard address
      and your API key.</p>
    <button id="openSetup" class="btn">Open settings</button>
  </section>

  <!-- Main form -->
  <section id="main" class="pad" hidden>
    <div id="banner" class="banner" hidden></div>

    <!-- Patient search -->
    <label class="field pos">
      <span>Patient</span>
      <input type="text" id="patientSearch" placeholder="Start typing a name…" autocomplete="off">
      <div id="results" class="ac-list" hidden></div>
    </label>
    <div class="row-mini">
      <small id="selected" class="muted"></small>
      <a href="#" id="addPatientLink" class="link">+ Add a new patient</a>
    </div>

    <!-- Add-new-patient block -->
    <fieldset id="newPatient" class="newpt" hidden>
      <legend>New patient</legend>
      <div class="two">
        <label class="field"><span>First name</span><input type="text" id="npFirst"></label>
        <label class="field"><span>Last name</span><input type="text" id="npLast"></label>
      </div>
      <div class="two">
        <label class="field"><span>Email</span><input type="email" id="npEmail"></label>
        <label class="field"><span>Mobile</span><input type="tel" id="npPhone"></label>
      </div>
      <button type="button" id="createPatient" class="btn ghost small">Create patient &amp; use it</button>
    </fieldset>

    <!-- Contact -->
    <div class="two">
      <label class="field"><span>Email</span><input type="email" id="email" placeholder="jane@example.com"></label>
      <label class="field"><span>Mobile (for text)</span><input type="tel" id="phone" placeholder="(902) 555-0123"></label>
    </div>

    <!-- Appointment -->
    <div class="two">
      <label class="field"><span>Service</span>
        <select id="typeKey">
          <option value="" disabled selected>Choose one…</option>
        </select>
      </label>
      <label class="field"><span>Remind days before</span>
        <input type="number" id="leadDays" min="0" max="60" value="3">
      </label>
    </div>
    <label class="field"><span>Appointment date &amp; time</span>
      <input type="datetime-local" id="apptAt">
    </label>

    <!-- Editable content -->
    <details id="contentBox" class="content">
      <summary>Reminder message <span class="muted">(editable)</span>
        <button type="button" id="resetTpl" class="link reset">↻ Reset to template</button>
      </summary>
      <label class="field"><span>Email subject</span><input type="text" id="emailSubject"></label>
      <label class="field"><span>Email message</span><textarea id="emailBody" rows="6"></textarea></label>
      <label class="field"><span>Text message</span><textarea id="smsText" rows="3"></textarea></label>
      <div class="two">
        <label class="field"><span>Review follow-up (days after, 0 = off)</span>
          <input type="number" id="reviewDays" min="0" max="60" value="0"></label>
      </div>
      <label class="field"><span>Review request message <span class="muted">(sends only if days &gt; 0)</span></span>
        <textarea id="reviewBody" rows="3"></textarea></label>
    </details>

    <button id="scheduleBtn" class="btn block">Schedule reminder</button>
    <p class="muted center tiny">Email or a mobile number is required.</p>
  </section>

  <script src="popup.js"></script>
</body>
</html>
