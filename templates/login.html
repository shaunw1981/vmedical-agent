<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#7c8a73">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VM Dash">

  <style>
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
           background:#f6f7f9; color:#1f2430; display:grid; place-items:center;
           min-height:100vh; }
    .box { background:#fff; border:1px solid #e5e7eb; border-radius:14px;
           padding:2.2rem; width:360px; text-align:center; }
    .logo-badge { width:76px; height:76px; border-radius:16px; background:#7c8a73;
           display:flex; flex-direction:column; align-items:center; justify-content:center;
           color:#fff; margin:0 auto 1rem; }
    .logo-badge .rule { width:32px; height:2px; background:#fff; opacity:.92; }
    .logo-badge .vm { font-family:Georgia,"Times New Roman",serif; font-weight:700;
           font-size:1.6rem; letter-spacing:.09em; margin:5px 0; }
    .brand { font-size:1.2rem; font-weight:700; margin-bottom:.3rem; }
    p { color:#6b7280; }
    .gbtn { display:inline-flex; align-items:center; gap:.6rem; margin-top:1rem;
            background:#fff; border:1px solid #d0d5dd; border-radius:8px;
            padding:.6rem 1rem; text-decoration:none; color:#1f2430;
            font-weight:600; }
    .gbtn:hover { background:#f9fafb; }
    .err { background:#fef2f2; border:1px solid #fecaca; color:#991b1b;
           padding:.6rem .9rem; border-radius:8px; margin-bottom:1rem;
           font-size:.9rem; }
    .note { margin-top:1rem; font-size:.82rem; color:#9ca3af; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo-badge"><span class="rule"></span><span class="vm">VM</span><span class="rule"></span></div>
    <div class="brand">Valley Medical</div>
    <p>Sign in with your work Google account.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    {% if google_ok %}
      <a class="gbtn" href="/auth/google">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.9 2.4 30.4 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.9 6.1C12.2 13.2 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.1 5.3-4.6 7l7.1 5.5c4.1-3.8 6.5-9.4 6.5-16z"/><path fill="#FBBC05" d="M10.4 28.6c-.5-1.4-.8-2.9-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.3-4.5 2.1-8.8 2.1-6.4 0-11.8-3.7-13.6-9l-7.9 6.1C6.4 42.6 14.6 48 24 48z"/></svg>
        Sign in with Google
      </a>
    {% else %}
      <div class="err">Google sign-in isn't configured yet. Add the Google
        credentials to <code>.env</code> (see SETUP-MACMINI.md).</div>
    {% endif %}
    <div class="note">Access is limited to the spa's team.</div>
  </div>
</body>
</html>
